async function discoverVideoClips(){
 if(clipDiscovering||clipDiscovered)return;
 clipDiscovering=true;

 const seen=new Set(recommendations.map(movieKey));let found=0;
 for(let i=0;i<terms.length;i+=2){
  const batches=await Promise.allSettled(terms.slice(i,i+2).map(fetchApple));
  for(const batch of batches){
   if(batch.status!=='fulfilled')continue;
   for(const movie of batch.value){
    if(!movie.previewUrl||!movie.previewUrl.startsWith('https://')||!movie.title||!movie.year)continue;
    const key=movieKey(movie);
    if(seen.has(key)||movies.some(x=>movieMatch(x,movie))||cleanTitle(movie.title)==='the platform')continue;
    seen.add(key);
    const text=cleanTitle(movie.title+' '+(movie.description||'')+' '+(movie.genre||''));
    if(!/horror|thriller|suspense|mystery|escape|surviv|deadly|murder|kidnap|puzzle|trap|hunt|game|experiment|prison/.test(text))continue;
    const genre=/escape|puzzle|trap|maze|saw/.test(text)?'puzzles':/game|hunt|surviv|deadly|death/.test(text)?'games':/experiment|test|trial|prison/.test(text)?'experiment':'mystery';
    recommendations.push(Object.assign({},movie,{genre:genre,why:(movie.description||'A suspenseful movie you may enjoy.').slice(0,180)}));found++;
   }
  }
  if(tab==='recommend'){document.getElementById('content').innerHTML=renderRecommendations();initShorts();}
  if(found>=20)break;
 }
 clipDiscovering=false;clipDiscovered=true;
 clipSearchMessage=found?'':'No direct movie preview videos are currently available.';
 if(tab==='recommend'){document.getElementById('content').innerHTML=renderRecommendations();initShorts();}
}

document.getElementById('content').onclick=e=>{const b=e.target.closest('button');if(!b){let d=e.target.closest('[data-detail]');if(d){showDetails(movies.find(m=>m.id===d.dataset.detail));return;}let sr=e.target.closest('[data-search-detail]');if(sr){showDetails(results.find(m=>String(m.catalogId)===sr.dataset.searchDetail));return;}let sh=e.target.closest('.shortinfo h3');if(sh){let s=sh.closest('[data-short]');showDetails(recommendations.find(m=>movieKey(m)===s.dataset.short));}return;}if(b.dataset.sound){soundEnabled=!soundEnabled;const slide=b.closest('.shortslide'),video=slide?.querySelector('video'),frame=slide?.querySelector('iframe.yt-short');if(video){video.muted=!soundEnabled;video.play().catch(()=>{});}if(frame&&frame.getAttribute('src'))frame.src='https://www.youtube-nocookie.com/embed/'+frame.dataset.youtube+'?autoplay=1&mute='+(soundEnabled?'0':'1')+'&playsinline=1&controls=1';document.querySelectorAll('[data-sound]').forEach(x=>{x.innerHTML=soundEnabled?soundIcon:muteIcon;});showToast(soundEnabled?'Sound on':'Sound off');return;}if(b.dataset.shortDetail){showDetails(recommendations.find(m=>movieKey(m)===b.dataset.shortDetail));return;}if(b.dataset.filter){recFilter=b.dataset.filter;render();return;}if(b.dataset.recommend){shortAdd(b.dataset.recommend);return;}if(b.dataset.preview){const slide=b.closest('.shortslide'),v=slide?.querySelector('video'),f=slide?.querySelector('iframe.yt-short');if(f){if(f.getAttribute('src')){f.removeAttribute('src');f.style.opacity='0';b.innerHTML=playIcon;}else{f.src='https://www.youtube-nocookie.com/embed/'+f.dataset.youtube+'?autoplay=1&mute='+(soundEnabled?'0':'1')+'&playsinline=1&controls=1';f.style.opacity='1';b.innerHTML=pauseIcon;}return;}if(v){if(v.paused){v.muted=!soundEnabled;v.play().catch(()=>{});b.innerHTML=pauseIcon;}else{v.pause();b.innerHTML=playIcon;}}return;}if(b.dataset.act){if(b.dataset.act==='remove'&&!removeMode){showToast('Enable remove mode in Settings first');return;}const m=movies.find(x=>x.id===b.dataset.id);if(!m)return;if(b.dataset.act==='rate')openRating(m.id);if(b.dataset.act==='watch'){m.status='watchlist';delete m.answers;save();showToast('Moved to watchlist')}if(b.dataset.act==='remove'&&removeMode&&confirm('Remove '+m.title+' from your collection?')){movies=movies.filter(x=>x.id!==m.id);save()}}if(b.dataset.add){let m=results.find(x=>String(x.catalogId)===b.dataset.add);if(m){const n={...m,id:uid(),status:'watchlist'};movies.push(n);save();if(b.dataset.mode==='rated')openRating(n.id);else showToast('Added to watchlist')}}};
document.getElementById('content').addEventListener('dblclick',shortDoubleTap);let shortTouchStart=null;document.getElementById('content').addEventListener('touchstart',e=>{const s=e.target.closest('.shortslide');if(s&&!e.target.closest('button')&&!e.target.closest('.shortinfo h3'))shortTouchStart={key:s.dataset.short,x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});document.getElementById('content').addEventListener('touchend',e=>{if(!shortTouchStart)return;const start=shortTouchStart;shortTouchStart=null;const t=e.changedTouches[0];if(Math.abs(t.clientY-start.y)>24||Math.abs(t.clientX-start.x)>24)return;const now=Date.now();if(lastShortTap.key===start.key&&now-lastShortTap.time<350&&Math.abs(t.clientY-lastShortTap.y)<35){shortAdd(start.key);lastShortTap.time=0;}else lastShortTap={key:start.key,time:now,x:t.clientX,y:t.clientY};},{passive:true});async function searchMovies(e){e.preventDefault();const q=document.getElementById('query').value.trim();if(!q)return;searchQuery=q;const resultEl=document.getElementById('results');resultEl.innerHTML='<div class="empty">Searching multiple movie catalogs…</div>';try{results=await lookupMovies(q);resultEl.innerHTML=results.length?results.map(searchCard).join(''):'<div class="empty">No matches found. Try another spelling, include the release year, or add the movie manually.</div>';}catch(err){resultEl.innerHTML='<div class="empty">Movie search services are unavailable right now. Check your connection or add a movie manually.</div>';}}
function manualAdd(){const title=prompt('Movie title:');if(!title?.trim())return;const yearTxt=prompt('Release year (optional):','');const year=yearTxt?Number(yearTxt):'';const found=movies.find(m=>m.title.toLowerCase()===title.trim().toLowerCase()&&String(m.year)===String(year));if(found){showToast('Movie already in collection');return}movies.push({id:uid(),title:title.trim(),year:Number.isInteger(year)&&year>1800&&year<2200?year:'',status:'watchlist'});tab='watchlist';save();showToast('Added to watchlist')}
function openRating(id){const m=movies.find(x=>x.id===id);if(!m)return;editing=id;answers=Array.from({length:10},(_,i)=>m.answers?.[i]??null);drawRating()}
function drawRating(){const m=movies.find(x=>x.id===editing);if(!m)return;const filled=answers.filter(x=>x!==null),preview=filled.length?(filled.reduce((a,b)=>a+b,0)*2/filled.length).toFixed(1):'—';document.getElementById('modalroot').innerHTML=`<div class="modal" id="modallayer"><div class="sheet"><div class="split"><div><div class="eyebrow">Rate your movie</div><h2>${escapeHtml(m.title)} <span class="muted">(${escapeHtml(m.year)})</span></h2></div><button class="close" id="closemodal" aria-label="Close">×</button></div>${questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${q[0]}</h3><div class="choices">${q[1].map((t,j)=>`<button class="choice ${answers[i]===j+1?'selected':''}" data-q="${i}" data-val="${j+1}">${escapeHtml(t)}</button>`).join('')}</div></div>`).join('')}<div class="ratingtotal"><div class="tiny">${filled.length===10?'Your final rating':'Live preview · '+filled.length+'/10 answered'}</div><strong>${preview} / 10</strong></div><div class="topactions"><button class="btn" id="saverating" ${filled.length!==10?'disabled':''}>Save movie rating</button><button class="btn secondary" id="skiprating">Skip for now</button></div></div></div>`;document.getElementById('closemodal').onclick=closeModal;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const sheet=b.closest('.sheet');const y=sheet.scrollTop;const q=+b.dataset.q;answers[q]=+b.dataset.val;drawRating();const next=document.querySelector('#modallayer .sheet');if(next)next.scrollTop=y;});document.getElementById('saverating').onclick=()=>{m.answers=answers.slice();m.status='rated';closeModal();tab='rated';save();showToast('Rating saved · '+score(m)+'/10')};document.getElementById('skiprating').onclick=()=>{closeModal();showToast('Movie left unchanged')};document.getElementById('modallayer').onclick=e=>{if(e.target.id==='modallayer')closeModal()}}
function closeModal(){document.getElementById('modalroot').innerHTML='';editing=null}
function listText(kind){const rated=movies.filter(m=>m.status==='rated').sort((a,b)=>+score(b)-+score(a));const watch=movies.filter(m=>m.status==='watchlist').sort((a,b)=>a.title.localeCompare(b.title));let lines=['🎬 My ReelVault Movie Collection'];if(kind!=='watchlist'){lines.push('','⭐ MY RATINGS');rated.forEach((m,i)=>lines.push(`${i+1}. ${m.title} (${m.year}) — ${score(m)}/10`))}if(kind!=='rated'){lines.push('','🍿 MY WATCHLIST');watch.forEach((m,i)=>lines.push(`${i+1}. ${m.title}${m.year?' ('+m.year+')':''}`))}return lines.join('\n')}
async function shareList(kind){const text=listText(kind);try{if(navigator.share){await navigator.share({title:'My ReelVault Movie Collection',text});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text);showToast('List copied — paste into Messages!')}catch{const blob=new Blob([text],{type:'text/plain'});downloadBlob(blob,'my-reelvault-list.txt')}}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportBackup(){downloadBlob(new Blob([JSON.stringify({app:'ReelVault',version:1,exported:new Date().toISOString(),movies},null,2)],{type:'application/json'}),'reelvault-backup.json');showToast('Backup exported')}
async function importBackup(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.movies)||obj.movies.some(m=>typeof m.title!=='string'||!['rated','watchlist'].includes(m.status)||m.answers&&(!Array.isArray(m.answers)||m.answers.some(n=>!Number.isInteger(n)||n<1||n>5))))throw Error('Invalid backup');if(!confirm('Replace your current collection with this backup?'))return;movies=obj.movies.map(m=>({id:String(m.id||uid()),title:m.title.slice(0,300),year:m.year||'',status:m.status,answers:m.status==='rated'?m.answers:undefined,artwork:typeof m.artwork==='string'&&m.artwork.startsWith('https://')?m.artwork:undefined,catalogId:m.catalogId,catalogUrl:m.catalogUrl}));save();showToast('Collection restored')}catch{alert('Could not import this backup file.')}e.target.value=''}
render();setTimeout(hydratePosters,200);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="anime.js?v=4"></script><script src="ask.js?v=1"></script></body></html>
